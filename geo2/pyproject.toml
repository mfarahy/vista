[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo2"
version = "0.1.0"
description = "Clean-room Floor Plan Image → validated 2D architectural geometry JSON engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "Pillow>=9.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
packages = ["geometry_ai", "geometry_ai.providers"]
# geo2 is a self-contained experiment; evaluation/ and tests/ are not installed.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"