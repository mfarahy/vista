apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vista-postgres.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | quote }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
