apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vista-nats.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: nats
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: nats
    spec:
      {{- with .Values.global }}
      {{- with .imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: nats
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.clientPort }}
              name: client
              protocol: TCP
            - containerPort: {{ .Values.service.monitorPort }}
              name: monitor
              protocol: TCP
          args:
            - "-c"
            - "/etc/nats-config/nats-server.conf"
          env:
            - name: SURVEYOR_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "vista-nats.fullname" . }}-secrets
                  key: SURVEYOR_USER
            - name: SURVEYOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vista-nats.fullname" . }}-secrets
                  key: SURVEYOR_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /etc/nats-config
              readOnly: true
            {{- if .Values.jetstream.enabled }}
            - name: data
              mountPath: {{ .Values.jetstream.storeDir }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: monitor
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: {{ include "vista-nats.fullname" . }}-config
        {{- if .Values.jetstream.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}