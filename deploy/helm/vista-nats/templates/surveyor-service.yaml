apiVersion: v1
kind: Service
metadata:
  name: {{ include "vista-nats.fullname" . }}-surveyor
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: nats-surveyor
spec:
  type: {{ .Values.surveyor.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: nats-surveyor
  ports:
    - name: http
      port: {{ .Values.surveyor.service.port }}
      targetPort: http
      protocol: TCP