global:
  imagePullSecrets:
    - name: gitlab-registry

replicaCount: ${VISTA_EXPOSE_REPLICAS}

image:
  repository: "${CI_REGISTRY_IMAGE}/vista-expose-service"
  tag: "${RELEASE_VERSION}"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 4000

ingress:
  enabled: true
  className: "${INGRESS_CLASS}"
  annotations:
    cert-manager.io/cluster-issuer: "${CLUSTER_ISSUER}"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: "api.${ROOT_DOMAIN}"
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    secretName: "${API_TLS_SECRET}"

config:
  HOST: "0.0.0.0"
  PORT: "4000"
  CORS_ORIGIN: "https://${ROOT_DOMAIN}"
  FRONTEND_URL: "https://${ROOT_DOMAIN}"
  API_BASE_URL: "https://api.${ROOT_DOMAIN}"
  OPENAI_BASE_URL: "${OPENAI_BASE_URL}"
  OPENAI_MODEL: "${OPENAI_MODEL}"
  LOG_LEVEL: "${LOG_LEVEL}"
  DATA_DIR: "/data"
  UPLOAD_DIR: "/data/uploads"

secrets:
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  FAL_KEY: "${FAL_KEY}"
  DATABASE_URL: "${DATABASE_URL}"

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
