replicaCount: 1

image:
  repository: ghcr.io/example/vista-expose-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 4000

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: api.vista.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    secretName: "api-vista-example-com-tls"

config:
  HOST: "0.0.0.0"
  PORT: "4000"
  CORS_ORIGIN: "https://vista.example.com,https://www.vista.example.com"
  FRONTEND_URL: "https://vista.example.com"
  API_BASE_URL: "https://api.vista.example.com"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MODEL: "gpt-4o-mini"
  GOOGLE_DOCUMENT_AI_PROJECT_ID: ""
  GOOGLE_DOCUMENT_AI_LOCATION: ""
  GOOGLE_DOCUMENT_AI_PROCESSOR_ID: ""
  LOG_LEVEL: "info"
  DATA_DIR: "/data"
  UPLOAD_DIR: "/data/uploads"
  DOCUMENT_STORAGE_PROVIDER: "r2"
  NATS_URL: "nats://nats:4222"
  NATS_SUBJECT_PREFIX: "vista.jobs"
  FLOORPLAN_RECOGNITION_URL: "http://floorplan-recognition:5000/predictions"
  RUNPOD_INFERENCE_URL: ""

secrets:
  OPENAI_API_KEY: ""
  FAL_KEY: ""
  MELTFLEX_API_KEY: ""
  DATABASE_URL: ""
  CLOUDFLARE_S3_API_ENDPOINT: ""
  CLOUDFLARE_ACCESS_KEY_ID: ""
  CLOUDFLARE_SECRET_ACCESS_KEY: ""
  CLOUDFLARE_R2_BUCKET: ""
  GOOGLE_DOCUMENT_AI_CREDENTIALS: ""

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
