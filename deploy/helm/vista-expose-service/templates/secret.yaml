apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | quote }}
  FAL_KEY: {{ .Values.secrets.FAL_KEY | quote }}
  MELTFLEX_API_KEY: {{ .Values.secrets.MELTFLEX_API_KEY | quote }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  CLOUDFLARE_S3_API_ENDPOINT: {{ .Values.secrets.CLOUDFLARE_S3_API_ENDPOINT | quote }}
  CLOUDFLARE_ACCESS_KEY_ID: {{ .Values.secrets.CLOUDFLARE_ACCESS_KEY_ID | quote }}
  CLOUDFLARE_SECRET_ACCESS_KEY: {{ .Values.secrets.CLOUDFLARE_SECRET_ACCESS_KEY | quote }}
  CLOUDFLARE_R2_BUCKET: {{ .Values.secrets.CLOUDFLARE_R2_BUCKET | quote }}
data:
  GOOGLE_DOCUMENT_AI_CREDENTIALS: {{ .Values.secrets.GOOGLE_DOCUMENT_AI_CREDENTIALS | quote }}
