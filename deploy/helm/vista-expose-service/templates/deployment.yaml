apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: ensure-data
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data/uploads"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: expose-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: PORT
              value: {{ .Values.config.PORT | quote }}
            - name: HOST
              value: {{ .Values.config.HOST | quote }}
            - name: CORS_ORIGIN
              value: {{ .Values.config.CORS_ORIGIN | quote }}
            - name: FRONTEND_URL
              value: {{ .Values.config.FRONTEND_URL | quote }}
            - name: API_BASE_URL
              value: {{ .Values.config.API_BASE_URL | quote }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.config.OPENAI_BASE_URL | quote }}
            - name: OPENAI_MODEL
              value: {{ .Values.config.OPENAI_MODEL | quote }}
            - name: GOOGLE_DOCUMENT_AI_PROJECT_ID
              value: {{ .Values.config.GOOGLE_DOCUMENT_AI_PROJECT_ID | default "" | quote }}
            - name: GOOGLE_DOCUMENT_AI_LOCATION
              value: {{ .Values.config.GOOGLE_DOCUMENT_AI_LOCATION | default "" | quote }}
            - name: GOOGLE_DOCUMENT_AI_PROCESSOR_ID
              value: {{ .Values.config.GOOGLE_DOCUMENT_AI_PROCESSOR_ID | default "" | quote }}
            - name: GOOGLE_DOCUMENT_AI_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: GOOGLE_DOCUMENT_AI_CREDENTIALS
            - name: LOG_LEVEL
              value: {{ .Values.config.LOG_LEVEL | quote }}
            - name: DATA_DIR
              value: {{ .Values.config.DATA_DIR | quote }}
            - name: UPLOAD_DIR
              value: {{ .Values.config.UPLOAD_DIR | quote }}
            - name: DOCUMENT_STORAGE_PROVIDER
              value: {{ .Values.config.DOCUMENT_STORAGE_PROVIDER | default "local" | quote }}
            - name: NATS_URL
              value: {{ .Values.config.NATS_URL | quote }}
            - name: NATS_SUBJECT_PREFIX
              value: {{ .Values.config.NATS_SUBJECT_PREFIX | quote }}
            - name: CLOUDFLARE_S3_API_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: CLOUDFLARE_S3_API_ENDPOINT
            - name: CLOUDFLARE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: CLOUDFLARE_ACCESS_KEY_ID
            - name: CLOUDFLARE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: CLOUDFLARE_SECRET_ACCESS_KEY
            - name: CLOUDFLARE_R2_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: CLOUDFLARE_R2_BUCKET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: OPENAI_API_KEY
            - name: FAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: FAL_KEY
            - name: MELTFLEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: MELTFLEX_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
