global:
  imagePullSecrets:
    - name: gitlab-registry

replicaCount: 1

image:
  repository: ghcr.io/example/vista-geometry-ai
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8787

config:
  HOST: "0.0.0.0"
  PORT: "8787"
  LOG_LEVEL: "info"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi