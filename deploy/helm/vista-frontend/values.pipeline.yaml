global:
  imagePullSecrets:
    - name: gitlab-registry

replicaCount: ${VISTA_FRONTEND_REPLICAS}

image:
  repository: "${CI_REGISTRY_IMAGE}/frontend"
  tag: "${RELEASE_VERSION}"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "${INGRESS_CLASS}"
  annotations:
    cert-manager.io/cluster-issuer: "${CLUSTER_ISSUER}"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: "${ROOT_DOMAIN}"
      paths:
        - path: /
          pathType: Prefix
    - host: "${WWW_DOMAIN}"
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    secretName: "${TLS_SECRET}"

config:
  NEXT_PUBLIC_APP_URL: "https://${ROOT_DOMAIN}"
  NEXT_PUBLIC_API_BASE_URL: "https://api.${ROOT_DOMAIN}"
  NEXT_PUBLIC_ENABLE_DEMO: "${NEXT_PUBLIC_ENABLE_DEMO}"

secrets:
  MELTFLEX_API_KEY: "${MELTFLEX_API_KEY}"
