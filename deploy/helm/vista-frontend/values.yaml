replicaCount: 2
image:
  repository: ghcr.io/example/vista-frontend
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: traefik
  host: vista.example.com
  path: /
  tls: []

config:
  NEXT_PUBLIC_API_BASE_URL: "http://vista-backend.default.svc.cluster.local"
  NEXT_PUBLIC_APP_URL: "https://vista.example.com"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
