replicaCount: 1

image:
  repository: ghcr.io/example/vista-frontend
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: vista.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    secretName: "vista-example-com-tls"

config:
  NEXT_PUBLIC_APP_URL: "https://vista.example.com"
  NEXT_PUBLIC_API_BASE_URL: "https://api.vista.example.com"
  NEXT_PUBLIC_ENABLE_DEMO: "true"

secrets:
  MELTFLEX_API_KEY: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
