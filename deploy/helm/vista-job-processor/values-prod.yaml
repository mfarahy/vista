replicaCount: 1
image:
  repository: ghcr.io/example/vista-job-processor
  tag: "1.0.0"
config:
  LOG_LEVEL: "info"
  NATS_URL: "nats://nats:4222"
  NATS_SUBJECT_PREFIX: "vista.jobs"
  DOCUMENT_STORAGE_PROVIDER: "r2"
  DOCUMENT_ANALYSIS_PROVIDER: "google"
  DOCUMENT_UNDERSTANDING_PROVIDER: "openai"
  GOOGLE_DOCUMENT_AI_PROJECT_ID: "replace-me"
  GOOGLE_DOCUMENT_AI_LOCATION: "eu"
  GOOGLE_DOCUMENT_AI_PROCESSOR_ID: "replace-me"
secrets:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/vista"
  CLOUDFLARE_S3_API_ENDPOINT: "replace-me"
  CLOUDFLARE_ACCESS_KEY_ID: "replace-me"
  CLOUDFLARE_SECRET_ACCESS_KEY: "replace-me"
  CLOUDFLARE_R2_BUCKET: "replace-me"
  GOOGLE_DOCUMENT_AI_CREDENTIALS: "replace-me"
  OPENAI_API_KEY: "replace-me"