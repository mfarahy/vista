replicaCount: 1

image:
  repository: ghcr.io/example/vista-job-processor
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 4100

config:
  HOST: "0.0.0.0"
  PORT: "4100"
  LOG_LEVEL: "info"
  PUBLIC_API_BASE_URL: "https://api.vista.example.com"
  NATS_URL: "nats://nats:4222"
  NATS_SUBJECT_PREFIX: "vista.jobs"
  DOCUMENT_STORAGE_PROVIDER: "r2"
  DOCUMENT_ANALYSIS_PROVIDER: "google"
  DOCUMENT_UNDERSTANDING_PROVIDER: "openai"
  GOOGLE_DOCUMENT_AI_PROJECT_ID: ""
  GOOGLE_DOCUMENT_AI_LOCATION: ""
  GOOGLE_DOCUMENT_AI_PROCESSOR_ID: ""
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MODEL: "gpt-4o-mini"

secrets:
  DATABASE_URL: ""
  CLOUDFLARE_S3_API_ENDPOINT: ""
  CLOUDFLARE_ACCESS_KEY_ID: ""
  CLOUDFLARE_SECRET_ACCESS_KEY: ""
  CLOUDFLARE_R2_BUCKET: ""
  GOOGLE_DOCUMENT_AI_CREDENTIALS: ""
  OPENAI_API_KEY: ""
  MELTFLEX_API_KEY: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
