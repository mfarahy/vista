apiVersion: v1
kind: ConfigMap
metadata:
  name: vista-expose-service-config
  labels:
    app: vista-expose-service
data:
  CORS_ORIGIN: "https://vista.example.com,https://www.vista.example.com"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MODEL: "gpt-4o-mini"
  GOOGLE_DOCUMENT_AI_PROJECT_ID: "replace-me"
  GOOGLE_DOCUMENT_AI_LOCATION: "eu"
  GOOGLE_DOCUMENT_AI_PROCESSOR_ID: "replace-me"
  LOG_LEVEL: "info"
  DOCUMENT_STORAGE_PROVIDER: "local"
  NATS_URL: "nats://nats:4222"
  NATS_SUBJECT_PREFIX: "vista.jobs"
