apiVersion: apps/v1
kind: Deployment
metadata:
  name: vista-web
  labels:
    app: vista-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vista-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: vista-web
    spec:
      containers:
        - name: web
          image: ghcr.io/example/vista-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: vista-web-config
                  key: NEXT_PUBLIC_API_BASE_URL
            - name: NEXT_PUBLIC_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: vista-web-config
                  key: NEXT_PUBLIC_APP_URL
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
