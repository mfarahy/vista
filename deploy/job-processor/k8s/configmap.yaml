apiVersion: v1
kind: ConfigMap
metadata:
  name: vista-job-processor-config
  labels:
    app: vista-job-processor
data:
  NATS_URL: "nats://nats:4222"
  NATS_SUBJECT_PREFIX: "vista.jobs"
  LOG_LEVEL: "info"
  DOCUMENT_STORAGE_PROVIDER: "r2"
  DOCUMENT_ANALYSIS_PROVIDER: "google"
  DOCUMENT_UNDERSTANDING_PROVIDER: "openai"
  GOOGLE_DOCUMENT_AI_PROJECT_ID: "replace-me"
  GOOGLE_DOCUMENT_AI_LOCATION: "eu"
  GOOGLE_DOCUMENT_AI_PROCESSOR_ID: "replace-me"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MODEL: "gpt-4o-mini"