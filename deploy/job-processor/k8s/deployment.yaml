apiVersion: apps/v1
kind: Deployment
metadata:
  name: vista-job-processor
  labels:
    app: vista-job-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vista-job-processor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: vista-job-processor
    spec:
      containers:
        - name: job-processor
          image: ghcr.io/example/vista-job-processor:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4100
          env:
            - name: PORT
              value: "4100"
            - name: HOST
              value: "0.0.0.0"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: vista-job-processor-config
                  key: LOG_LEVEL
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: vista-job-processor-config
                  key: NATS_URL
            - name: NATS_SUBJECT_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: vista-job-processor-config
                  key: NATS_SUBJECT_PREFIX
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vista-job-processor-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: 4100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
