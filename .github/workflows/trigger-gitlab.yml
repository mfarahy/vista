name: Trigger GitLab CI

on:
  push:
    branches:
      - main

jobs:
  trigger-gitlab:
    runs-on: ubuntu-latest

    steps:
    - name: Trigger GitLab CI Pipeline
      run: |
        curl --request POST \
          --form token=${{ secrets.GITLAB_TRIGGER_TOKEN }} \
          --form ref=main \
          --form "variables[GITHUB_SHA]=${{ github.sha }}" \
          --form "variables[GITHUB_REF]=${{ github.ref_name }}" \
          --form "variables[RUN_INTEGRATION_TESTS]=true" \
          https://gitlab.com/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline
