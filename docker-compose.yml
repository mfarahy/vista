# ─── Full Stack Orchestration ────────────────────────────────────────────────────
# Spins up PostgreSQL, backend API, frontend app, and marketing website.
# Override any variable via .env file (docker compose --env-file .env up).

networks:
  monitor-net:
    driver: bridge

services:
  # ── Database ──────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mailmind}
    volumes:
      - pgdata:/var/lib/postgresql/data
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mailmind}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Cache (Redis) ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Message Queue (NATS) ─────────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8222/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - monitor-net

  # ── Object Storage (MinIO — S3-compatible, optional for local dev) ────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    profiles:
      - storage

  # ── Async Job Processor (consumes jobs from NATS) ─────────────────────────────
  job-processor:
    build:
      context: ./job-processor
    restart: unless-stopped
    ports:
      - "${JOB_PROCESSOR_PORT:-4100}:4100"
    environment:
      NATS_URL: nats://nats:4222
      NATS_SUBJECT_PREFIX: vista.jobs
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/vista}"
      # Document files are read directly from the shared object storage (R2);
      # the worker no longer calls expose-service over HTTP.
      DOCUMENT_STORAGE_PROVIDER: "${DOCUMENT_STORAGE_PROVIDER:-local}"
      DOCUMENT_ANALYSIS_PROVIDER: google
      DOCUMENT_UNDERSTANDING_PROVIDER: openai
      GOOGLE_DOCUMENT_AI_PROJECT_ID: "${GOOGLE_DOCUMENT_AI_PROJECT_ID:-}"
      GOOGLE_DOCUMENT_AI_LOCATION: "${GOOGLE_DOCUMENT_AI_LOCATION:-}"
      GOOGLE_DOCUMENT_AI_PROCESSOR_ID: "${GOOGLE_DOCUMENT_AI_PROCESSOR_ID:-}"
      GOOGLE_DOCUMENT_AI_CREDENTIALS: "${GOOGLE_DOCUMENT_AI_CREDENTIALS:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      CLOUDFLARE_S3_API_ENDPOINT: "${CLOUDFLARE_S3_API_ENDPOINT:-http://minio:9000}"
      CLOUDFLARE_ACCESS_KEY_ID: "${CLOUDFLARE_ACCESS_KEY_ID:-minioadmin}"
      CLOUDFLARE_SECRET_ACCESS_KEY: "${CLOUDFLARE_SECRET_ACCESS_KEY:-minioadmin}"
      CLOUDFLARE_R2_BUCKET: "${CLOUDFLARE_R2_BUCKET:-vista}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - monitor-net

volumes:
  pgdata:
  prometheus_data:
  redisdata:
  miniodata:
