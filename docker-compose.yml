version: "3.9"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vista-backend:local
    container_name: vista-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:3000
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/public/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/vista}
    volumes:
      - ./backend/data:/app/data
      - ./backend/public/uploads:/app/public/uploads
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vista-frontend:local
    container_name: vista-frontend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://backend:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: vista-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vista
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
